<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이스터에그 테스트</title><link rel="stylesheet" href="./assets/jackpot.css"><style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:linear-gradient(180deg,#ffffffc2,#ffffff52),linear-gradient(135deg,#f8f5ef 0%,#f0ebe2 46%,#edf3ee 100%);color:#171717;font-family:system-ui,sans-serif;min-height:100vh}main{max-width:520px;margin:20px auto;padding:clamp(22px,4.5vw,36px);border:1px solid #2820181a;border-radius:24px;background:#fffdf8;box-shadow:0 18px 45px #2018121f}h1{font-size:28px;margin:0 0 10px;font-weight:900}.stage{background:linear-gradient(180deg,#ffffff0a,#ffffff00),#1d1a17;position:relative;overflow:hidden;border:1px solid #ffffff14;border-radius:22px;padding:24px 20px;display:grid;gap:8px;min-height:210px;box-shadow:inset 0 1px 0 #ffffff1a}.slot{position:relative;height:58px;border-radius:16px;border:1px solid #ffffff1c;background:#ffffff14;color:#fffffff0;display:grid;align-items:center;justify-items:start;padding:0 14px;font-weight:900;font-size:clamp(18px,5vw,27px);box-shadow:inset 0 12px 20px #00000038;overflow:hidden}.slot::before,.slot::after{content:"";position:absolute;left:0;right:0;height:12px;pointer-events:none}.slot::before{top:0;background:linear-gradient(180deg,#1d1a17e0,transparent)}.slot::after{bottom:0;background:linear-gradient(0deg,#1d1a17e0,transparent)}.gold{border-color:#edbd67;color:#ffda83;box-shadow:0 0 10px #efbd5244}.cat-sprite-canvas,.hamster-sprite-canvas{z-index:12;image-rendering:pixelated;filter:drop-shadow(0 3px 2px #0004)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button,select{font:inherit;font-size:13px;border:1px solid #e8e1d6;background:#fffaf3;padding:12px;border-radius:13px;color:inherit}button{cursor:pointer;flex:1;font-weight:800}button:disabled{opacity:.5}p,a{font-size:13px;color:#6b665f;line-height:1.6}#status{text-align:center;color:#ffffff9e;min-height:20px;font-weight:800;margin:0}@media(max-width:560px){body{padding:14px}main{margin:0 auto}.stage{padding:20px 16px}}
</style></head><body><main><h1>이스터에그 테스트</h1><div class="stage" id="stage"><div class="slot">가상 식당 A</div><div class="slot">가상 식당 B</div><div class="slot">가상 식당 C</div><div class="slot">가상 식당 D</div><div class="slot">가상 식당 E</div><p id="status"></p></div><div class="actions"><button id="hamster">햄스터</button><button id="jackpot">잭팟</button><button id="cat">고양이</button><select id="style" aria-label="고양이 털 색"><option value="ginger">치즈</option><option value="mackerel">고등어</option><option value="tuxedo">턱시도</option><option value="calico">삼색이</option></select></div><div class="jackpot-sound-row"><button type="button" data-jackpot-sound aria-pressed="true">효과음 켜짐</button></div><p>모든 식당명은 연출 확인용 가상 이름입니다. 잭팟은 매번 무작위로 하나를 선택하며, 햄스터는 2번과 4번 슬롯을 변경합니다. 실제 방 설정과 추첨 확률에는 영향을 주지 않습니다.</p><a href="./">점심 뽑기로 돌아가기</a></main><script src="./assets/cat-motion.js?v=2.5.4"></script><script src="./assets/hamster-motion.js"></script><script src="./assets/jackpot-motion.js"></script><script>
const stage=document.getElementById("stage"),slots=[...stage.querySelectorAll(".slot")],status=document.getElementById("status"),buttons=[...document.querySelectorAll(".actions button")],items=["가상 식당 A","가상 식당 B","가상 식당 C","가상 식당 D","가상 식당 E","가상 식당 F","가상 식당 G"];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function spin(finals,delay=0){await Promise.all(slots.map(async(s,i)=>{await wait(i*delay);for(let n=0;n<12;n++){s.textContent=items[(n+i*2)%items.length];await wait(100);}s.textContent=finals[i];}));}
async function play(type){if(type==="jackpot")LunchJackpot.prime();buttons.forEach(b=>b.disabled=true);slots.forEach((s,i)=>{s.classList.remove("gold","j-won");s.textContent=items[i];});status.classList.remove("j-final-status");status.textContent="";try{if(type==="hamster")await LunchHamster.visit({stage,windows:slots,targetIndices:[1,3],onRun:async i=>{const slot=slots[i];for(let n=0;n<10;n++){slot.textContent=items[(n+i)%items.length];await wait(100);}slot.textContent=i===1?"가상 식당 F":"가상 식당 G";}});else if(type==="jackpot"){const winner=items[Math.floor(Math.random()*items.length)];await LunchJackpot.run({stage,windows:slots,status,spin:async onLock=>{await Promise.all(slots.map(async(slot,i)=>{const duration=820+i*530,start=performance.now();let n=0;while(performance.now()-start<duration){slot.textContent=items[(n+++i)%items.length];await wait(75);}slot.textContent=winner;onLock(i);}));}});}else await LunchCat.visit(stage,slots[0],true,()=>{slots[0].textContent="가상 식당 F";},{variant:document.getElementById("style").value});}catch(e){status.textContent="모션을 불러오지 못했습니다.";}finally{buttons.forEach(b=>b.disabled=false);}}
for(const id of ["hamster","jackpot","cat"])document.getElementById(id).onclick=()=>play(id);
</script></body></html>
