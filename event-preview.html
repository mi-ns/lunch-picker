<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이스터에그 테스트</title><link rel="stylesheet" href="./assets/jackpot.css"><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#f6f2eb;color:#302820;font-family:system-ui,sans-serif}main{max-width:500px;margin:25px auto;padding:22px;border:1px solid #e3dbd0;border-radius:20px;background:#fffdf8}h1{font-size:22px}.stage{background:#211e1b;position:relative;overflow:hidden;border-radius:16px;padding:62px 18px 18px;display:grid;gap:8px;min-height:250px}.slot{height:48px;border-radius:10px;border:1px solid #ffffff25;background:#ffffff0c;color:white;display:grid;place-items:center;font-weight:800;font-size:20px}.gold{border-color:#edbd67;color:#ffda83;box-shadow:0 0 10px #efbd5244}.cat-sprite-canvas,.hamster-sprite-canvas{z-index:12;image-rendering:pixelated}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,select{font:inherit;font-size:13px;border:1px solid #ded6cb;background:#fff;padding:10px;border-radius:10px;color:inherit}button{cursor:pointer;flex:1}button:disabled{opacity:.5}p,a{font-size:13px;color:#746b61}#status{text-align:center;color:#ffda83;min-height:20px;font-weight:900;margin:0}</style></head><body><main><h1>이스터에그 테스트</h1><div class="stage" id="stage"><div class="slot">백소정</div><div class="slot">핵밥</div><div class="slot">포람</div><div class="slot">탄포포</div><div class="slot">온뚝</div><p id="status"></p></div><div class="actions"><button id="hamster">햄스터</button><button id="jackpot">잭팟</button><button id="cat">고양이</button><select id="style" aria-label="고양이 털 색"><option value="ginger">치즈</option><option value="mackerel">고등어</option><option value="tuxedo">턱시도</option><option value="calico">삼색이</option></select></div><div class="jackpot-sound-row"><button type="button" data-jackpot-sound aria-pressed="true">효과음 켜짐</button></div><p>햄스터는 테스트에서 2번과 4번만 바꿉니다. 실제 추첨은 무작위로 선택하며 확률에는 영향을 주지 않습니다.</p><a href="./">점심 뽑기로 돌아가기</a></main><script src="./assets/cat-motion.js"></script><script src="./assets/hamster-motion.js"></script><script src="./assets/jackpot-motion.js"></script><script>
const stage=document.getElementById("stage"),slots=[...stage.querySelectorAll(".slot")],status=document.getElementById("status"),buttons=[...document.querySelectorAll(".actions button")],items=["백소정","핵밥","포람","탄포포","온뚝","레오펍"];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function spin(finals,delay=0){await Promise.all(slots.map(async(s,i)=>{await wait(i*delay);for(let n=0;n<12;n++){s.textContent=items[(n+i*2)%items.length];await wait(100);}s.textContent=finals[i];}));}
async function play(type){if(type==="jackpot")LunchJackpot.prime();buttons.forEach(b=>b.disabled=true);slots.forEach((s,i)=>{s.classList.remove("gold","j-won");s.textContent=items[i];});status.classList.remove("j-final-status");status.textContent="";try{if(type==="hamster")await LunchHamster.visit({stage,windows:slots,targetIndices:[1,3],onRun:async i=>{const slot=slots[i];for(let n=0;n<10;n++){slot.textContent=items[(n+i)%items.length];await wait(100);}slot.textContent=i===1?"레오펍":"미식당";}});else if(type==="jackpot"){await LunchJackpot.run({stage,windows:slots,status,spin:async onLock=>{await Promise.all(slots.map(async(slot,i)=>{const duration=820+i*530,start=performance.now();let n=0;while(performance.now()-start<duration){slot.textContent=items[(n+++i)%items.length];await wait(75);}slot.textContent="포람";onLock(i);}));}});}else await LunchCat.visit(stage,slots[0],true,()=>{slots[0].textContent="레오펍";},{variant:document.getElementById("style").value});}catch(e){status.textContent="모션을 불러오지 못했습니다.";}finally{buttons.forEach(b=>b.disabled=false);}}
for(const id of ["hamster","jackpot","cat"])document.getElementById(id).onclick=()=>play(id);
</script></body></html>
