<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고양이 모션 테스트</title><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#f6f2eb;color:#302820}main{max-width:480px;margin:30px auto;background:#fffdf8;padding:22px;border:1px solid #e4ddd3;border-radius:20px}h1{font-size:21px;margin:0 0 16px}.stage{position:relative;overflow:hidden;height:205px;background:#211e1b;border-radius:18px;display:flex;align-items:center;justify-content:center}.slot{width:88%;height:64px;border:1px solid #ffffff26;border-radius:13px;background:#ffffff0c;color:white;font-weight:800;font-size:26px;display:grid;place-items:center;margin-top:35px}.cat-sprite-canvas{z-index:2}.cat-impact{animation:impact .35s ease-out}@keyframes impact{18%{transform:translateY(7px) rotate(-.7deg)}44%{transform:translateY(-3px)}72%{transform:translateY(1px)}}.actions{display:flex;gap:8px;margin-top:13px}button{flex:1;border:1px solid #ded6cb;padding:12px;border-radius:10px;font:inherit;font-size:13px;background:white;cursor:pointer}button:first-child{background:#e54835;color:white;border-color:#e54835}button:disabled{opacity:.5;cursor:default}p,a{font-size:13px;color:#746b61}a{display:inline-block;margin-top:12px}</style></head><body><main><h1>고양이 모션 테스트</h1><div id="stage" class="stage"><div id="slot" class="slot">백소정</div></div><div class="actions"><button id="hit">냥냥펀치</button><button id="watch">구경만 하기</button></div><p id="status">실제 사이트와 동일한 스프라이트와 모션입니다.</p><a href="./">점심 뽑기로 돌아가기</a></main><script src="./assets/cat-motion.js"></script><script>
const stage=document.getElementById("stage"),slot=document.getElementById("slot"),status=document.getElementById("status"),buttons=[...document.querySelectorAll("button")];
async function play(hit){buttons.forEach(b=>b.disabled=true);slot.textContent="백소정";status.textContent="";try{await LunchCat.visit(stage,slot,hit,()=>{slot.textContent="핵밥";});status.textContent="다시 재생할 수 있습니다.";}catch(e){status.textContent="모션을 불러오지 못했습니다.";}finally{buttons.forEach(b=>b.disabled=false);}}
buttons[0].onclick=()=>play(true);buttons[1].onclick=()=>play(false);
</script></body></html>
